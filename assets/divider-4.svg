<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="60" viewBox="0 0 1600 60">
  <defs>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="80%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="30%" stop-color="#38BDF8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="glass-blur">
      <feGaussianBlur stdDeviation="0 1"/>
    </filter>
  </defs>

  <rect width="1600" height="60" fill="#0D1117"/>

  <!-- Glass panel body -->
  <rect x="100" y="20" width="1400" height="20" rx="10" fill="url(#glassGrad)" filter="url(#glass-blur)"/>

  <!-- Top edge shine — animates opacity for shimmer effect -->
  <line x1="100" y1="20" x2="1500" y2="20" stroke="url(#glassEdge)" stroke-width="1" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
  </line>

  <!-- Bottom edge -->
  <line x1="100" y1="40" x2="1500" y2="40" stroke="url(#glassEdge)" stroke-width="0.5" opacity="0.4"/>

  <!-- Shimmer highlight: a narrow rect that fades in/out at different positions to simulate sweep -->
  <rect x="100" y="20" width="200" height="20" rx="10" fill="white" opacity="0">
    <animate attributeName="x" values="100;1300;100" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.06;0;0.06;0" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
