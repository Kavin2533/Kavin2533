<svg xmlns="http://www.w3.org/2000/svg" width="400" height="620" viewBox="0 0 400 620">
  <!-- ══════════════════════════════════════════════════════════════
       DEVELOPER ID BADGE — Lanyard · Metal Clip · Badge · Barcode
       ══════════════════════════════════════════════════════════════ -->

  <defs>
    <!-- Card gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B22" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <!-- Card border gradient -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.6" />
    </linearGradient>

    <!-- Lanyard gradient -->
    <linearGradient id="lanyardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Metal clip gradient -->
    <linearGradient id="metalClip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF" />
      <stop offset="30%" stop-color="#D1D5DB" />
      <stop offset="60%" stop-color="#9CA3AF" />
      <stop offset="100%" stop-color="#6B7280" />
    </linearGradient>

    <!-- Avatar ring gradient -->
    <linearGradient id="avatarRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Security strip gradient -->
    <linearGradient id="securityStrip" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15" />
      <stop offset="25%" stop-color="#EC4899" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.15" />
      <stop offset="75%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="idGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="shadow" />
      <feOffset dx="0" dy="4" in="shadow" result="offsetShadow" />
      <feFlood flood-color="#000000" flood-opacity="0.3" result="color" />
      <feComposite in="color" in2="offsetShadow" operator="in" result="colorShadow" />
      <feMerge>
        <feMergeNode in="colorShadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clip for avatar circle -->
    <clipPath id="avatarClip">
      <circle cx="200" cy="280" r="48" />
    </clipPath>
  </defs>

  <!-- ═══ LANYARD ═══ -->
  <!-- Lanyard straps going up to top -->
  <path d="M170,140 Q170,40 200,5" fill="none" stroke="url(#lanyardGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <animate attributeName="d" values="M170,140 Q170,40 200,5;M170,140 Q168,40 200,5;M170,140 Q170,40 200,5" dur="4s" repeatCount="indefinite" />
  </path>
  <path d="M230,140 Q230,40 200,5" fill="none" stroke="url(#lanyardGrad)" stroke-width="12" stroke-linecap="round" opacity="0.9">
    <animate attributeName="d" values="M230,140 Q230,40 200,5;M232,140 Q232,40 200,5;M230,140 Q230,40 200,5" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Lanyard text -->
  <text x="185" y="85" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="7" fill="#C9D1D9" letter-spacing="2" transform="rotate(-8, 185, 85)" opacity="0.5">DEVELOPER</text>
  <text x="210" y="85" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="7" fill="#C9D1D9" letter-spacing="2" transform="rotate(8, 210, 85)" opacity="0.5">ACCESS</text>

  <!-- ═══ METAL CLIP ═══ -->
  <g filter="url(#softShadow)">
    <!-- Clip body -->
    <rect x="180" y="130" width="40" height="30" rx="4" fill="url(#metalClip)" />
    <!-- Clip detail -->
    <rect x="185" y="135" width="30" height="6" rx="2" fill="#6B7280" opacity="0.5" />
    <!-- Clip pin -->
    <rect x="195" y="125" width="10" height="12" rx="2" fill="url(#metalClip)" />
    <!-- Clip shine -->
    <rect x="188" y="132" width="8" height="2" rx="1" fill="#E5E7EB" opacity="0.6" />
  </g>

  <!-- ═══ BADGE CARD ═══ -->
  <g filter="url(#softShadow)">
    <!-- Card body -->
    <rect x="60" y="160" width="280" height="430" rx="20" fill="url(#cardBg)" />
    <!-- Card border -->
    <rect x="60" y="160" width="280" height="430" rx="20" fill="none" stroke="url(#cardBorder)" stroke-width="1.5" />
  </g>

  <!-- Security strip at top of card -->
  <rect x="60" y="160" width="280" height="40" rx="20" fill="url(#securityStrip)">
    <animate attributeName="opacity" values="0.8;0.5;0.8" dur="4s" repeatCount="indefinite" />
  </rect>
  <!-- Clip the bottom corners of security strip -->
  <rect x="60" y="185" width="280" height="15" fill="url(#securityStrip)" opacity="0.6" />

  <!-- Company/Org label -->
  <text x="200" y="185" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="10" fill="#8B5CF6" letter-spacing="4" font-weight="600" opacity="0.8">GITHUB DEVELOPER</text>

  <!-- Holographic strip effect -->
  <rect x="70" y="200" width="260" height="2" fill="url(#cardBorder)" opacity="0.3" rx="1" />

  <!-- ═══ AVATAR ═══ -->
  <!-- Avatar glow ring -->
  <circle cx="200" cy="280" r="54" fill="none" stroke="url(#avatarRing)" stroke-width="3" filter="url(#idGlow)">
    <animate attributeName="stroke-opacity" values="0.8;0.4;0.8" dur="3s" repeatCount="indefinite" />
  </circle>
  <!-- Avatar outer ring -->
  <circle cx="200" cy="280" r="52" fill="none" stroke="url(#avatarRing)" stroke-width="2.5" />
  <!-- Avatar background -->
  <circle cx="200" cy="280" r="48" fill="#1a1b27" />
  <!-- Avatar initials -->
  <text x="200" y="290" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="36" fill="url(#avatarRing)" font-weight="700" letter-spacing="2">KG</text>

  <!-- ═══ NAME & ROLE ═══ -->
  <text x="200" y="365" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="24" fill="#E2E8F0" font-weight="700" letter-spacing="2">KAVIN G</text>

  <text x="200" y="390" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" letter-spacing="3" font-weight="500">SOFTWARE ENGINEER</text>

  <!-- Divider line -->
  <line x1="110" y1="410" x2="290" y2="410" stroke="url(#cardBorder)" stroke-width="0.8" opacity="0.4" />

  <!-- ═══ DETAILS ═══ -->
  <text x="200" y="435" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="10" fill="#8B9EB3" letter-spacing="1">📍 Tamil Nadu, India</text>
  <text x="200" y="455" text-anchor="middle" font-family="'SF Pro Display', 'Inter', 'Segoe UI', sans-serif" font-size="10" fill="#8B9EB3" letter-spacing="1">🎓 ECE Student</text>

  <!-- ═══ CONTACT ICONS ROW ═══ -->
  <g transform="translate(200, 485)" text-anchor="middle">
    <!-- GitHub -->
    <g transform="translate(-50, 0)" opacity="0.7">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#8B5CF6" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-size="13">🐙</text>
    </g>
    <!-- LinkedIn -->
    <g transform="translate(0, 0)" opacity="0.7">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#EC4899" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-size="13">💼</text>
    </g>
    <!-- Email -->
    <g transform="translate(50, 0)" opacity="0.7">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#22D3EE" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" font-size="13">📧</text>
    </g>
  </g>

  <!-- ═══ BARCODE ═══ -->
  <g transform="translate(115, 520)" opacity="0.35">
    <!-- Barcode lines -->
    <rect x="0" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="5" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="9" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="14" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="18" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="23" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="27" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="33" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="37" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="42" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="46" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="52" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="57" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="61" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="66" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="72" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="76" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="81" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="85" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="91" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="96" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="100" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="105" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="111" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="115" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="120" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="124" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="130" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="135" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="139" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="144" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="148" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="154" y="0" width="2" height="30" fill="#C9D1D9" />
    <rect x="159" y="0" width="1" height="30" fill="#C9D1D9" />
    <rect x="163" y="0" width="3" height="30" fill="#C9D1D9" />
    <rect x="169" y="0" width="1" height="30" fill="#C9D1D9" />
  </g>

  <!-- Barcode number -->
  <text x="200" y="570" text-anchor="middle" font-family="'Courier New', 'SF Mono', monospace" font-size="9" fill="#6B7280" letter-spacing="3">DEV-2533-KAVIN-2026</text>

  <!-- ═══ BOTTOM SECURITY STRIP ═══ -->
  <rect x="60" y="577" width="280" height="13" rx="0" fill="url(#securityStrip)" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.3;0.5" dur="5s" repeatCount="indefinite" />
  </rect>
  <!-- Round bottom corners -->
  <rect x="60" y="570" width="280" height="20" rx="20" fill="url(#cardBg)" opacity="0" />
</svg>
