  </circle>
  <circle cx="900" cy="300" r="1" fill="#38BDF8" opacity="0.3">
    <animate attributeName="cy" values="300;275;300" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1400" cy="500" r="1.8" fill="#34D399" opacity="0.3">
    <animate attributeName="cy" values="500;478;500" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="10s" repeatCount="indefinite"/>
