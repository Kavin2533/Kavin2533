<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="200" viewBox="0 0 1600 200">
  <!-- ══════════════════════════════════════════════════════════════
       FOOTER — Animated Aurora Wave
       ══════════════════════════════════════════════════════════════ -->

  <defs>
    <linearGradient id="footerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="33%" stop-color="#EC4899" />
      <stop offset="66%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="footerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="footerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.3" />
    </linearGradient>

    <filter id="footerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="200" fill="#0D1117" />

  <!-- Wave layer 3 (back, most transparent) -->
  <path fill="url(#footerGrad3)" opacity="0.5">
    <animate attributeName="d"
      values="M0,120 C200,80 400,140 600,100 C800,60 1000,130 1200,90 C1400,50 1500,110 1600,80 L1600,200 L0,200 Z;
              M0,100 C200,140 400,80 600,120 C800,150 1000,70 1200,110 C1400,80 1500,130 1600,100 L1600,200 L0,200 Z;
              M0,120 C200,80 400,140 600,100 C800,60 1000,130 1200,90 C1400,50 1500,110 1600,80 L1600,200 L0,200 Z"
      dur="10s" repeatCount="indefinite" />
  </path>

  <!-- Wave layer 2 (middle) -->
  <path fill="url(#footerGrad2)" opacity="0.6">
    <animate attributeName="d"
      values="M0,140 C200,110 400,160 600,130 C800,100 1000,150 1200,120 C1400,90 1500,140 1600,110 L1600,200 L0,200 Z;
              M0,130 C200,160 400,110 600,140 C800,160 1000,100 1200,140 C1400,120 1500,150 1600,130 L1600,200 L0,200 Z;
              M0,140 C200,110 400,160 600,130 C800,100 1000,150 1200,120 C1400,90 1500,140 1600,110 L1600,200 L0,200 Z"
      dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Wave layer 1 (front, most opaque) -->
  <path fill="url(#footerGrad1)" opacity="0.25">
    <animate attributeName="d"
      values="M0,160 C200,140 400,175 600,155 C800,135 1000,170 1200,150 C1400,130 1500,160 1600,145 L1600,200 L0,200 Z;
              M0,150 C200,170 400,140 600,160 C800,175 1000,140 1200,160 C1400,145 1500,170 1600,155 L1600,200 L0,200 Z;
              M0,160 C200,140 400,175 600,155 C800,135 1000,170 1200,150 C1400,130 1500,160 1600,145 L1600,200 L0,200 Z"
      dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Thin glowing line along top wave -->
  <path fill="none" stroke="url(#footerGrad1)" stroke-width="1.5" opacity="0.4" filter="url(#footerGlow)">
    <animate attributeName="d"
      values="M0,140 C200,110 400,160 600,130 C800,100 1000,150 1200,120 C1400,90 1500,140 1600,110;
              M0,130 C200,160 400,110 600,140 C800,160 1000,100 1200,140 C1400,120 1500,150 1600,130;
              M0,140 C200,110 400,160 600,130 C800,100 1000,150 1200,120 C1400,90 1500,140 1600,110"
      dur="8s" repeatCount="indefinite" />
  </path>

  <!-- Scattered particles on waves -->
  <circle cx="300" cy="160" r="1.5" fill="#8B5CF6" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="700" cy="145" r="1" fill="#EC4899" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="1100" cy="135" r="1.5" fill="#22D3EE" opacity="0.45">
    <animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="1400" cy="150" r="1" fill="#6366F1" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.1;0.35" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>
