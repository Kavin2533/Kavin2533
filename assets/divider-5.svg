<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="60" viewBox="0 0 1600 60">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="40%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <filter id="neon-glow">
      <feGaussianBlur stdDeviation="0 5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1600" height="60" fill="#0D1117"/>

  <!-- Neon glow halo -->
  <line x1="0" y1="30" x2="1600" y2="30" stroke="url(#neonGrad)" stroke-width="8" opacity="0.3" filter="url(#neon-glow)">
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- Neon core line -->
  <line x1="0" y1="30" x2="1600" y2="30" stroke="url(#neonGrad)" stroke-width="1.5" opacity="1">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite"/>
  </line>

  <!-- Pulsing center node -->
  <circle cx="800" cy="30" r="5" fill="#34D399" filter="url(#neon-glow)" opacity="0.9">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Side nodes -->
  <circle cx="400" cy="30" r="3" fill="#38BDF8" filter="url(#neon-glow)" opacity="0.7">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1200" cy="30" r="3" fill="#38BDF8" filter="url(#neon-glow)" opacity="0.7">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>
